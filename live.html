<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>JevBag Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#161616;--layer:#262626;--line:#393939;--text:#f4f4f4;--muted:#c6c6c6;--allow:#42be65;--ask:#f1c21b;--block:#fa4d56;--focus:#78a9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'IBM Plex Sans',system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:40px 16px}
h1{font-weight:300;font-size:clamp(28px,4vw,42px);line-height:1.15;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px}
form{display:flex;gap:0;border:1px solid var(--line);margin-bottom:28px}
input{flex:1;min-width:0;background:var(--layer);color:var(--text);border:0;padding:16px;font:18px 'IBM Plex Mono',monospace;outline:none}
input:focus{box-shadow:inset 0 0 0 2px var(--focus)}
button{background:#0f62fe;color:#fff;border:0;padding:0 28px;font:16px 'IBM Plex Sans',sans-serif;cursor:pointer}
.run{border:1px solid var(--line);background:var(--layer);margin-bottom:16px}
.head{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid var(--line)}
.tag{font:14px 'IBM Plex Mono',monospace;padding:4px 10px;border:1px solid;text-transform:uppercase}
.allow .tag{color:var(--allow)}.ask .tag{color:var(--ask)}.block .tag{color:var(--block)}.wait .tag{color:var(--muted)}
.cmd{font:17px 'IBM Plex Mono',monospace;word-break:break-all;flex:1}
.ms{color:var(--muted);font:14px 'IBM Plex Mono',monospace;white-space:nowrap}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.s{background:var(--layer);padding:12px 16px}.s span{color:var(--muted);font-size:13px}
.s b{display:block;font:300 28px 'IBM Plex Mono',monospace}.s.hot b{color:var(--block)}.s.warm b{color:var(--ask)}
.bar{height:4px;background:var(--line);margin-top:6px}.bar i{display:block;height:100%;background:currentColor}
.said{padding:14px 16px;font:14px/1.5 'IBM Plex Mono',monospace;color:var(--muted);border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
@media (max-width:640px){.scores{grid-template-columns:repeat(2,1fr)}.head{flex-wrap:wrap}}
</style></head><body><main>
<h1>Type a command Claude Code might run. Jev decides whether it runs.</h1>
<p class="sub">Each command goes through the real hook.py exactly as Claude Code sends it, from a project folder called jev-airbag-demo. Nothing is executed.</p>
<form id="f"><input id="c" autocomplete="off" spellcheck="false" placeholder="git push --force origin main"><button>Check</button></form>
<div id="out"></div>
</main><script>
const HIGH={destroys:.80,remote:.80,escapes:.85,critical:.70},ASK={destroys:.50,remote:.80,escapes:.85,critical:.65};
const VERDICT={allow:"Runs normally. Exit 0.",ask:"Claude Code stops and asks you first.",block:"Blocked. Exit 2, and Claude is told why."};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();const inp=document.getElementById("c"),cmd=inp.value.trim();if(!cmd)return;
  const card=document.createElement("div");card.className="run wait";
  card.innerHTML=`<div class="head"><span class="tag">asking Jev</span><span class="cmd">${esc(cmd)}</span></div>`;
  document.getElementById("out").prepend(card);inp.value="";
  const r=await fetch("/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command:cmd})}).then(x=>x.json());
  card.className="run "+r.tier;
  const scores=["destroys","remote","escapes","critical"].map(k=>{const v=r[k]??0,cls=v>=HIGH[k]?"hot":v>=ASK[k]?"warm":"";
    return `<div class="s ${cls}"><span>${k}</span><b>${v.toFixed(2)}</b><div class="bar"><i style="width:${v*100}%"></i></div></div>`}).join("");
  const said=r.stderr||r.stdout||"(no output)";
  card.innerHTML=`<div class="head"><span class="tag">${r.tier}</span><span class="cmd">${esc(cmd)}</span><span class="ms">${r.ms??"?"} ms · ${r.tokens??"?"} tokens</span></div>
  <div class="scores">${scores}</div>
  <div class="said">${esc(VERDICT[r.tier])}${r.why?" Reason: "+esc(r.why)+".":""}\n\nhook.py said: ${esc(said)}</div>`;
};
</script></body></html>
